name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install deps (CPU torch)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov ruff
      - name: Lint
        run: . .venv/bin/activate && ruff check src tests scripts
      - name: Tests
        env:
          CLASSIFIER_BACKEND: rules
          RAG_BACKEND: demo
        run: . .venv/bin/activate && pytest tests -q --cov=ragm --cov-report=term-missing
      - name: Retrieval gate (deterministic fixture)
        run: . .venv/bin/activate && python scripts/eval_all.py --suite retrieval --fixture-only

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
