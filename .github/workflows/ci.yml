name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Install deps (CPU torch)
        run: |
          uv venv .venv --python 3.13
          . .venv/bin/activate
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e '.[dev]'
      - name: Lint
        run: . .venv/bin/activate && ruff check src tests
      - name: Tests
        env:
          CLASSIFIER_BACKEND: rules
          RAG_BACKEND: demo
        run: . .venv/bin/activate && pytest tests -q
      - name: Retrieval gate (deterministic fixture)
        run: . .venv/bin/activate && python scripts/eval_all.py --suite retrieval --fixture-only

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
