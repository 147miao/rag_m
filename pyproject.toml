[project]
name = "ragm"
version = "0.1.0"
description = "Router-based hybrid RAG: simple / multi-hop / agentic (LangGraph + Milvus + Neo4j)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "langgraph==1.2.18",
  "langchain==1.4.7",
  "langchain-openai>=1.0.0",
  "langgraph-checkpoint-sqlite==3.1.2",
  "pymilvus==3.0.2",
  "sentence-transformers==6.2.0",
  "torch==2.15.0",
  "FlagEmbedding>=1.4.2",
  "unstructured[pdf,md,docx]==0.27.36",
  "datasets==5.1.0",
  "pyarrow>=18.0.0",
  "neo4j==6.4.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "tenacity>=9.0.0",
  "orjson>=3.10.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
eval = [
  "ragas==0.4.3",
  "langchain-community<0.4",
]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
